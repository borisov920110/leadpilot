<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LeadPilot</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #172033;
    }

    header {
      background: #111827;
      color: white;
      padding: 18px 20px;
    }

    header h1 {
      margin: 0;
    }

    .container {
      max-width: 900px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.06);
    }

    .chat {
      height: 400px;
      overflow-y: auto;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 15px;
      background: #fafafa;
    }

    .message {
      margin-bottom: 12px;
      padding: 10px 13px;
      border-radius: 10px;
      max-width: 85%;
    }

    .bot {
      background: #e5e7eb;
    }

    .user {
      background: #2563eb;
      color: white;
      margin-left: auto;
    }

    .input-area {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    input {
      flex: 1;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 13px 18px;
      background: #2563eb;
      color: white;
      cursor: pointer;
      font-size: 15px;
    }

    .dashboard-button {
      background: #10b981;
      margin-bottom: 15px;
    }

    .hidden {
      display: none;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }

    th, td {
      padding: 12px;
      border-bottom: 1px solid #ddd;
      text-align: left;
    }

    @media (max-width: 600px) {
      .input-area {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>🚀 LeadPilot</h1>
  <div>AI асистент за бизнеса</div>
</header>

<div class="container">
  <div class="card">

    <button class="dashboard-button" onclick="showDashboard()">
      📊 Dashboard
    </button>

    <div id="chatSection">
      <h2>AI асистент</h2>

      <div id="chat" class="chat">
        <div class="message bot">
          Здравейте! 👋 Как мога да ви помогна?
        </div>
      </div>

      <div class="input-area">
        <input
          id="messageInput"
          type="text"
          placeholder="Напишете съобщение..."
        >

        <button onclick="sendMessage()">Изпрати</button>
      </div>
    </div>

    <div id="dashboardSection" class="hidden">
      <h2>📊 Dashboard</h2>

      <p>Тук ще виждате събраните потенциални клиенти.</p>

      <table>
        <thead>
          <tr>
            <th>Име</th>
            <th>Контакт</th>
            <th>Запитване</th>
          </tr>
        </thead>

        <tbody>
          <tr>
            <td colspan="3">Все още няма записани leads.</td>
          </tr>
        </tbody>
      </table>

      <br>

      <button onclick="showChat()">← Назад към чата</button>
    </div>

  </div>
</div>

<script>
async function sendMessage() {
  const input = document.getElementById("messageInput");
  const message = input.value.trim();

  if (!message) return;

  addMessage(message, "user");
  input.value = "";

  try {
    const response = await fetch("/api/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ message })
    });

    const data = await response.json();
    addMessage(data.reply, "bot");

  } catch (error) {
    addMessage(
      "Възникна грешка при свързването с AI.",
      "bot"
    );
  }
}

function addMessage(text, type) {
  const chat = document.getElementById("chat");
  const message = document.createElement("div");

  message.className = "message " + type;
  message.textContent = text;

  chat.appendChild(message);
  chat.scrollTop = chat.scrollHeight;
}

function showDashboard() {
  document.getElementById("chatSection").classList.add("hidden");
  document.getElementById("dashboardSection").classList.remove("hidden");
}

function showChat() {
  document.getElementById("dashboardSection").classList.add("hidden");
  document.getElementById("chatSection").classList.remove("hidden");
}

document.getElementById("messageInput").addEventListener("keydown", function(event) {
  if (event.key === "Enter") {
    sendMessage();
  }
});
</script>

</body>
</html>
